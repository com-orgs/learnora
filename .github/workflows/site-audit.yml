name: Learnora Site Audit

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run static website audit
        run: node scripts/audit-site.mjs
      - name: Verify Cloudflare Pages preview headers and assets
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://audit-production-hardening-2.learnora-ab2.pages.dev"
          status="000"
          for attempt in {1..30}; do
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /tmp/learnora-home.html --dump-header /tmp/learnora-headers --write-out '%{http_code}' "$base_url/" || true)
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Preview not ready yet (HTTP $status); retry $attempt/30"
            sleep 10
          done
          test "$status" = "200"
          grep -Eiq "^x-frame-options: *DENY" /tmp/learnora-headers
          grep -Eiq "^x-content-type-options: *nosniff" /tmp/learnora-headers
          grep -Eiq "^referrer-policy: *strict-origin-when-cross-origin" /tmp/learnora-headers
          grep -Eiq "^strict-transport-security: *max-age=31536000" /tmp/learnora-headers
          grep -Eiq "^permissions-policy:" /tmp/learnora-headers
          grep -Eiq "^content-security-policy:.*script-src 'self'.*script-src-attr 'none'.*frame-ancestors 'none'.*object-src 'none'" /tmp/learnora-headers
          grep -Fq '<script src="/scripts/pages/index.js" defer></script>' /tmp/learnora-home.html
          curl --fail --silent --show-error "$base_url/scripts/pages/index.js" --output /dev/null
          curl --fail --silent --show-error "$base_url/math/grade-6/understanding-fractions.html" --output /dev/null
          curl --fail --silent --show-error "$base_url/scripts/pages/math-grade-6-understanding-fractions.js" --output /dev/null
          missing_status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /tmp/learnora-404.html --write-out '%{http_code}' "$base_url/__learnora_audit_missing_route__")
          test "$missing_status" = "404"
          grep -Eiq "Page Not Found" /tmp/learnora-404.html
          echo "PASS: preview HTML, security headers, CSP, lesson scripts and custom 404 response."

      - name: Install Playwright and Chromium
        if: github.ref != 'refs/heads/main'
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Run mobile, desktop and quiz browser checks against this commit
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/learnora-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8788/sitemap.xml --output /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/learnora-http.log
            echo "Local Learnora preview did not start."
            exit 1
          fi
          LEARNORA_PREVIEW_URL=http://127.0.0.1:8788 node scripts/browser-smoke.mjs

      - name: Refresh persistent project tracker with CI result
        if: always() && github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("PROJECT_STATUS.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "- Status: Pending first tracker-aware workflow run.": f"- Status: {os.environ['JOB_STATUS']}.",
              "- Tested commit: `dae65e3765846e4caff40d05089eb4cee34d5848`": f"- Tested commit: `{os.environ['TESTED_SHA']}`",
              "- Workflow: Learnora Site Audit": f"- Workflow: Learnora Site Audit (run [#{os.environ['RUN_ID']}]({os.environ['RUN_URL']}))",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
          text = text.replace(
              "## CI status (automatically refreshed by GitHub Actions)",
              "## CI status (automatically refreshed by GitHub Actions)\n\n"
              f"- Last updated automatically: {os.environ.get('GITHUB_RUN_ATTEMPT', '1')} attempt on branch `{os.environ['BRANCH_NAME']}`.",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh project CI status [skip ci]"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
