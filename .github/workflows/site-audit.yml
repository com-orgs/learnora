name: Learnora Site Audit

on:
  push:
    branches: [main, 'audit/**', 'seo/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: learnora-site-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read
  issues: read
  checks: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run static website audit
        run: node scripts/audit-site.mjs
      - name: Run legal and pre-monetisation readiness audit
        run: node scripts/audit-legal-readiness.mjs

      - name: Resolve the exact Cloudflare PR branch preview
        id: preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER_INPUT: ${{ github.event.pull_request.number || '' }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$PR_NUMBER_INPUT"
          if [ -z "$pr_number" ]; then
            pr_number=$(gh api "repos/$REPOSITORY/pulls?state=open&head=${REPOSITORY%%/*}:$BRANCH_NAME" --jq '.[0].number // empty')
          fi
          test -n "$pr_number" || { echo 'No open PR found for this branch; cannot safely identify a preview.'; exit 1; }
          preview_url=''
          for attempt in {1..30}; do
            comments=$(gh api "repos/$REPOSITORY/issues/$pr_number/comments?per_page=100")
            preview_url=$(printf '%s' "$comments" | jq -r '[.[] | select(.user.login == "cloudflare-workers-and-pages[bot]") | .body | try capture("Branch Preview URL:</strong></td><td>\\s*<a href=\\x27(?<url>https://[^\\x27]+)\\x27").url catch empty] | map(select(length > 0)) | last // empty')
            if [ -n "$preview_url" ]; then break; fi

            # If the bot comment is missing, resolve the preview from this exact commit's successful Pages check.
            checks=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100")
            preview_url=$(printf '%s' "$checks" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages" and .conclusion == "success") | .output.summary // "" | try capture("Preview URL:</strong></td><td>\\s*<a href=\\x27(?<url>https://[^\\x27]+)\\x27").url catch empty] | map(select(length > 0)) | last // empty')
            if [ -n "$preview_url" ]; then
              echo "Resolved exact commit preview from successful Cloudflare Pages check run."
              break
            fi
            echo "Waiting for Cloudflare preview evidence ($attempt/30)..."
            sleep 10
          done
          case "$preview_url" in https://*.learnora-ab2.pages.dev) ;; *) echo 'Preview URL is outside the Learnora Cloudflare Pages domain.'; exit 1 ;; esac
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare Pages preview headers and assets
        if: github.event_name == 'pull_request'
        env:
          LEARNORA_PREVIEW_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          base_url="${LEARNORA_PREVIEW_URL%/}"
          status="000"
          for attempt in {1..30}; do
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /tmp/learnora-home.html --dump-header /tmp/learnora-headers --write-out '%{http_code}' "$base_url/" || true)
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Preview not ready yet (HTTP $status); retry $attempt/30"
            sleep 10
          done
          test "$status" = "200"
          grep -Eiq "^x-frame-options: *DENY" /tmp/learnora-headers
          grep -Eiq "^x-content-type-options: *nosniff" /tmp/learnora-headers
          grep -Eiq "^referrer-policy: *strict-origin-when-cross-origin" /tmp/learnora-headers
          grep -Eiq "^strict-transport-security: *max-age=31536000" /tmp/learnora-headers
          grep -Eiq "^permissions-policy:" /tmp/learnora-headers
          grep -Eiq "^content-security-policy:.*script-src 'self'.*script-src-attr 'none'.*frame-ancestors 'none'.*object-src 'none'" /tmp/learnora-headers
          grep -Fq '<script src="/scripts/pages/index.js" defer></script>' /tmp/learnora-home.html
          curl --fail --silent --show-error "$base_url/scripts/pages/index.js" --output /dev/null
          curl --fail --silent --show-error "$base_url/math/grade-6/understanding-fractions.html" --output /dev/null
          curl --fail --silent --show-error "$base_url/scripts/pages/math-grade-6-understanding-fractions.js" --output /dev/null
          missing_status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /tmp/learnora-404.html --write-out '%{http_code}' "$base_url/__learnora_audit_missing_route__")
          test "$missing_status" = "404"
          grep -Eiq "Page Not Found" /tmp/learnora-404.html
          echo "PASS: preview HTML, security headers, CSP, lesson scripts and custom 404 response."

      - name: Install Playwright and Chromium
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Run mobile, desktop and quiz browser checks against this commit
        if: github.event_name == 'pull_request'
        env:
          LEARNORA_PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: node scripts/browser-smoke.mjs

      - name: Refresh persistent project tracker with CI result
        if: always() && github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${BRANCH_NAME}"
          git reset --hard "origin/${BRANCH_NAME}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("PROJECT_STATUS.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          out = []
          for line in lines:
              if line.startswith("- Status:"):
                  line = f"- Status: {os.environ['JOB_STATUS']}."
              elif line.startswith("- Tested commit:"):
                  line = f"- Tested commit: `{os.environ['TESTED_SHA']}`"
              elif line.startswith("- Workflow: Learnora Site Audit"):
                  line = f"- Workflow: Learnora Site Audit (run [#{os.environ['RUN_ID']}]({os.environ['RUN_URL']}))"
              elif line.startswith("- Last updated automatically:"):
                  line = f"- Last updated automatically: run #{os.environ['RUN_ID']} on branch `{os.environ['BRANCH_NAME']}`."
              out.append(line)
          if not any(line.startswith("- Last updated automatically:") for line in out):
              i = out.index("## CI status (automatically refreshed by GitHub Actions)")
              out.insert(i + 1, f"- Last updated automatically: run #{os.environ['RUN_ID']} on branch `{os.environ['BRANCH_NAME']}`.")
              out.insert(i + 2, "")
          path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh project CI status [skip ci]"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
